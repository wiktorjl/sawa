[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-data-mcp-server"
version = "0.3.0"
description = "MCP server for stock market data in PostgreSQL"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "sawa>=0.3.0,<0.4",
    "mcp>=2.1,<3",
    "jsonschema>=4.20",
    "psycopg[binary]>=3.0.15,<4",
    "psycopg_pool>=3.1",
    "pydantic>=2.0",
    "plotext>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "charts",
    "database.py",
    "monitoring.py",
    "server.py",
    "tools",
    "utils",
    "validation.py",
]

[tool.hatch.build.targets.wheel.sources]
"" = "mcp_server"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
